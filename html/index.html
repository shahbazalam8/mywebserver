<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Web Page</title>
    <style>
        /* Basic CSS for the sample page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }
        nav ul li {
            display: inline;
            margin: 0 10px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 20px 0;
        }
        .main-content {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Sample Website</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="main-content">
            <h2>About This Page</h2>
            <p>This is a simple **index.html** file, which is typically the **homepage** of a website. It demonstrates basic HTML structure and a touch of inline CSS styling (within the `<style>` tags in the `<head>`).</p>
            
            <h3>Key HTML Elements Used:</h3>
            <ul>
                <li>`<!DOCTYPE html>`: Defines the document type.</li>
                <li>`<html lang="en">`: The root element, specifying the language.</li>
                <li>`<head>`: Contains metadata (like title, character set, and styles).</li>
                <li>`<body>`: Contains all the visible page content.</li>
                <li>`<header>`, `<nav>`, `<main>`, `<footer>`: Semantic structure elements.</li>
                <li>`<h1>` to `<h3>`: Headings.</li>
                <li>`<p>`: Paragraphs.</li>
                <li>`<ul>` and `<li>`: Unordered lists and list items.</li>
            </ul>
            
            <p>You can save this code as **index.html** and open it in any web browser to see the result!</p>
            
            <a href="#" style="display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px;">Click Me (Link Example)</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Sample Web Page. All rights reserved.</p>
    </footer>

</body>
</html>

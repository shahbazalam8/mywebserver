name: 🚀 Sync Releases on Merge

permissions:
  contents: write
  pull-requests: write
  checks: write

on:
  pull_request:
    types: [closed]
    branches:
      # Trigger only when a PR is merged into any branch starting with 'release/'
      - 'release/**'

jobs:
  sync_changes:
    # Only run if the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4
      with:
        # We need to fetch all history and branches for merging
        fetch-depth: 0 
        # Set up token for pushing (needed for merge/push)
        token: ${{ secrets.TOKEN_GITHUB }}
    
    - name: 🧾 Configure Git committer (for merges and pushes)
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

        
    - name: 🎣 Define branches
      id: branches
      run: |
        # The branch the PR was merged into (e.g., release/v1.0.0)
        SOURCE_BRANCH=${{ github.base_ref }}
        
        # ⚠️ IMPORTANT: CUSTOMIZE THIS LIST
        # List ALL subsequent release branches you want to merge into.
        TARGET_BRANCHES="release/25.05 release/25.06 release/25.07" 
        
        echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
        echo "target_branches=$TARGET_BRANCHES" >> $GITHUB_OUTPUT

    - name: 🔄 Merge changes into subsequent release branches
      run: |
        SOURCE_BRANCH="${{ steps.branches.outputs.source_branch }}"
        
        for TARGET_BRANCH in ${{ steps.branches.outputs.target_branches }}; do
          echo "Attempting to merge changes from $SOURCE_BRANCH into $TARGET_BRANCH..."
          
          # Check if the target branch exists remotely
          if git ls-remote --exit-code origin $TARGET_BRANCH; then
            git checkout $TARGET_BRANCH
            
            # Merge and check for success
            if git merge --no-ff $SOURCE_BRANCH -m "Merge branch '$SOURCE_BRANCH' into $TARGET_BRANCH for feature synchronization"; then
              echo "Successfully merged into $TARGET_BRANCH."
              
              # Push the merged change back to the remote repository
              git push origin $TARGET_BRANCH
              echo "Pushed changes to $TARGET_BRANCH."
            else
              echo "⚠️ Merge conflicts encountered in $TARGET_BRANCH. Manual intervention required."
              # Abort the merge operation locally to clean the workspace
              git merge --abort 
              echo "::error::Merge conflict when syncing $SOURCE_BRANCH to $TARGET_BRANCH. Manual intervention required. Check the GitHub Actions run logs."
              # Fail the job to alert the team
              exit 1 
            fi
            
          else
            echo "Branch $TARGET_BRANCH does not exist. Skipping."
          fi
        done